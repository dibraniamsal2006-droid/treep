name: treep
description: "Treep – train alarm app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.0
  shared_preferences: ^2.2.3
  http: ^1.6.0
  gtfs_realtime_bindings: ^1.1.0

  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
